; PlatformIO 项目配置 — ESP32-S3 USB Dongle 网关（阶段二 5.4）
; 目标板：MuseLab ESP32-S3FN8 U 盘板（USB-JTAG/CDC → Pi /dev/ttyACM0）
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared
    ; S3 用 USB-CDC 作为 Serial（否则 Serial 输出走 UART0，Pi 的 /dev/ttyACM0 收不到数据）
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
